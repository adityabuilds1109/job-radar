name: Job Alert

on:
  schedule:
    # 03:30 and 12:30 UTC = 9:00 AM and 6:00 PM India time
    - cron: "30 3 * * *"
    - cron: "30 12 * * *"
  workflow_dispatch: # lets you run it manually from the Actions tab

permissions:
  contents: write # needed to commit data/seen.json back to the repo

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: npm start
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESUME_TEXT: ${{ secrets.RESUME_TEXT }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}

      - name: Save seen jobs
        run: |
          git config user.name "job-alert-bot"
          git config user.email "job-alert-bot@users.noreply.github.com"
          git add data/seen.json
          git diff --cached --quiet || git commit -m "Update seen jobs"
          git push
